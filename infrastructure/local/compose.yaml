name: aaraj-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy infrastructure/local/.env.example to .env.local first}
      POSTGRES_USER: ${POSTGRES_USER:?copy infrastructure/local/.env.example to .env.local first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy infrastructure/local/.env.example to .env.local first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

volumes:
  postgres-data:
