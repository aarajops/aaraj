name: AARAJ Production Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aaraj-production
  cancel-in-progress: false

jobs:
  deployment-gate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.deployment.outputs.commit }}
      tag: ${{ steps.deployment.outputs.tag }}
    steps:
      - name: Checkout deployment history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate main deployment commit
        id: deployment
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          baseline_tag="$(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)"
          [[ -n "$baseline_tag" ]] || {
            echo 'A stable release baseline tag is required by the installed VPS migration validator.' >&2
            exit 1
          }
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$baseline_tag" >> "$GITHUB_OUTPUT"
          {
            echo '### Production deployment gate passed'
            echo
            echo '- Source: `main` push'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Release baseline: \`$baseline_tag\` (no new version tag is needed for this deployment)"
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: deployment-gate
    uses: ./.github/workflows/ci.yml

  migration-policy:
    needs: [deployment-gate, ci]
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.policy.outputs.required }}
    steps:
      - name: Checkout deployment history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment-gate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Drizzle migration changes
        id: policy
        env:
          DEPLOYMENT_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
        run: |
          set -euo pipefail
          previous="$(git tag --merged "$DEPLOYMENT_COMMIT" --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)"
          if [[ -z "$previous" ]]; then
            migration_base="$(git hash-object -t tree -w --stdin </dev/null)"
            required=true
            reason='No earlier stable release tag exists; initial schema state needs explicit review.'
          else
            migration_base="$previous"
            if git diff --quiet "$previous" "$DEPLOYMENT_COMMIT" -- apps/api/drizzle; then
              required=false
              reason="No Drizzle migration files changed since the latest stable release tag $previous."
            else
              status=$?
              if [[ $status -ne 1 ]]; then exit "$status"; fi
              required=true
              reason="Drizzle migration files changed since the latest stable release tag $previous."
            fi
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          {
            echo '### Migration review policy'
            echo
            echo "- $reason"
            echo '- Existing API CI runs fresh-schema and historical-upgrade migration compatibility tests.'
            echo '- If migrations are required, review the migration diff and confirm a recent verified backup at the protected production approval.'
            echo '- Migration execution remains isolated on the VPS under the separate migration role; production database credentials stay on the VPS.'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '#### Migration file summary'
            git diff --stat "$migration_base" "$DEPLOYMENT_COMMIT" -- apps/api/drizzle
            git diff --name-status "$migration_base" "$DEPLOYMENT_COMMIT" -- apps/api/drizzle
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-verify:
    needs: [deployment-gate, ci]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aaraj_smoke
          POSTGRES_USER: aaraj_smoke
          POSTGRES_PASSWORD: aaraj_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaraj_smoke -d aaraj_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment-gate.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm 12.5.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.5.1
          run_install: false

      - name: Verify toolchain and install frozen dependencies
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(pnpm --version)" = "12.5.1"
          pnpm install --frozen-lockfile

      - name: Build and package one immutable commit artifact
        env:
          DEPLOYMENT_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
          RELEASE_TAG: ${{ needs.deployment-gate.outputs.tag }}
        run: >-
          node infrastructure/production/package-release.mjs
          --tag "$RELEASE_TAG"
          --commit "$DEPLOYMENT_COMMIT"
          --out-dir "$RUNNER_TEMP/aaraj-release"

      - name: Extract and smoke-test the production artifact
        env:
          E2E_POSTGRES_HOST: 127.0.0.1
          E2E_POSTGRES_PORT: 5432
          E2E_POSTGRES_DATABASE: aaraj_smoke
          E2E_POSTGRES_USER: aaraj_smoke
          E2E_POSTGRES_PASSWORD: aaraj_smoke
          E2E_REDIS_URL: redis://127.0.0.1:6379/14
          DEPLOYMENT_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
          RELEASE_TAG: ${{ needs.deployment-gate.outputs.tag }}
        run: |
          set -euo pipefail
          node infrastructure/production/verify-release.mjs \
            --archive "$RUNNER_TEMP/aaraj-release/aaraj-release.tar.gz" \
            --commit "$DEPLOYMENT_COMMIT" \
            --tag "$RELEASE_TAG" \
            --smoke

      - name: Upload the verified release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aaraj-release-${{ needs.deployment-gate.outputs.commit }}
          path: ${{ runner.temp }}/aaraj-release/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [deployment-gate, ci, migration-policy, build-and-verify]
    if: >-
      always() &&
      needs.deployment-gate.result == 'success' &&
      needs.ci.result == 'success' &&
      needs.migration-policy.result == 'success' &&
      needs.build-and-verify.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: aaraj-production
    steps:
      - name: Checkout deployment helper for the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment-gate.outputs.commit }}
          persist-credentials: false

      - name: Download the verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aaraj-release-${{ needs.deployment-gate.outputs.commit }}
          path: ${{ runner.temp }}/aaraj-release

      - name: Setup Node.js 24 for health response validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate and provision Pathao runtime configuration
        env:
          RELEASE_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
          AARAJ_DEPLOY_HOST: ${{ vars.AARAJ_DEPLOY_HOST }}
          AARAJ_DEPLOY_PORT: ${{ vars.AARAJ_DEPLOY_PORT }}
          AARAJ_DEPLOY_USER: ${{ vars.AARAJ_DEPLOY_USER }}
          AARAJ_DEPLOY_SSH_KEY: ${{ secrets.AARAJ_DEPLOY_SSH_KEY }}
          AARAJ_DEPLOY_KNOWN_HOSTS: ${{ secrets.AARAJ_DEPLOY_KNOWN_HOSTS }}
          PATHAO_BASE_URL: ${{ vars.PATHAO_BASE_URL }}
          PATHAO_DELIVERY_TYPE: ${{ vars.PATHAO_DELIVERY_TYPE }}
          PATHAO_TOKEN_ENCRYPTION_KEY: ${{ secrets.PATHAO_TOKEN_ENCRYPTION_KEY }}
          PATHAO_SANDBOX_CLIENT_ID: ${{ secrets.PATHAO_SANDBOX_CLIENT_ID }}
          PATHAO_SANDBOX_CLIENT_SECRET: ${{ secrets.PATHAO_SANDBOX_CLIENT_SECRET }}
          PATHAO_SANDBOX_USERNAME: ${{ secrets.PATHAO_SANDBOX_USERNAME }}
          PATHAO_SANDBOX_PASSWORD: ${{ secrets.PATHAO_SANDBOX_PASSWORD }}
          PATHAO_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PATHAO_SANDBOX_WEBHOOK_SECRET }}
          PATHAO_LIVE_CLIENT_ID: ${{ secrets.PATHAO_LIVE_CLIENT_ID }}
          PATHAO_LIVE_CLIENT_SECRET: ${{ secrets.PATHAO_LIVE_CLIENT_SECRET }}
          PATHAO_LIVE_USERNAME: ${{ secrets.PATHAO_LIVE_USERNAME }}
          PATHAO_LIVE_PASSWORD: ${{ secrets.PATHAO_LIVE_PASSWORD }}
          PATHAO_LIVE_WEBHOOK_SECRET: ${{ secrets.PATHAO_LIVE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          node -e 'const { buildPayload } = require("./infrastructure/production/host/aaraj-configure-pathao.cjs"); buildPayload(process.env, process.env.RELEASE_COMMIT);' >/dev/null
          if node <<'NODE' | bash infrastructure/production/deploy-release.sh pathao-apply "$RELEASE_COMMIT"
          const { buildPayload } = require("./infrastructure/production/host/aaraj-configure-pathao.cjs");
          process.stdout.write(buildPayload(process.env, process.env.RELEASE_COMMIT));
          NODE
          then
            exit 0
          fi
          echo 'Pathao configuration provisioning failed; attempting to restore this release transaction.' >&2
          bash infrastructure/production/deploy-release.sh pathao-restore "$RELEASE_COMMIT" || {
            echo 'Pathao configuration restore failed. Stop rollout and recover the pending transaction before another deploy.' >&2
            exit 1
          }
          exit 1

      - name: Stage and migrate AARAJ
        env:
          RELEASE_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
          MIGRATION_REQUIRED: ${{ needs.migration-policy.outputs.required }}
          AARAJ_DEPLOY_HOST: ${{ vars.AARAJ_DEPLOY_HOST }}
          AARAJ_DEPLOY_PORT: ${{ vars.AARAJ_DEPLOY_PORT }}
          AARAJ_DEPLOY_USER: ${{ vars.AARAJ_DEPLOY_USER }}
          AARAJ_DEPLOY_SSH_KEY: ${{ secrets.AARAJ_DEPLOY_SSH_KEY }}
          AARAJ_DEPLOY_KNOWN_HOSTS: ${{ secrets.AARAJ_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/aaraj-release/aaraj-release.tar.gz"
          bash infrastructure/production/deploy-release.sh stage "$RELEASE_COMMIT" "$artifact"

          if [[ "$MIGRATION_REQUIRED" == true ]]; then
            {
              echo "Migration-bearing release $RELEASE_COMMIT is staged. The protected production job is running its migration automatically on the VPS."
              echo
              echo 'The release activates only after the migration service reports successful completion.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No migration files changed; the VPS migration runner will verify schema history and reconcile runtime grants before activation.' >> "$GITHUB_STEP_SUMMARY"
          fi
          bash infrastructure/production/deploy-release.sh migrate "$RELEASE_COMMIT"

      - name: Activate and verify AARAJ
        env:
          RELEASE_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
          MIGRATION_REQUIRED: ${{ needs.migration-policy.outputs.required }}
          AARAJ_DEPLOY_HOST: ${{ vars.AARAJ_DEPLOY_HOST }}
          AARAJ_DEPLOY_PORT: ${{ vars.AARAJ_DEPLOY_PORT }}
          AARAJ_DEPLOY_USER: ${{ vars.AARAJ_DEPLOY_USER }}
          AARAJ_DEPLOY_SSH_KEY: ${{ secrets.AARAJ_DEPLOY_SSH_KEY }}
          AARAJ_DEPLOY_KNOWN_HOSTS: ${{ secrets.AARAJ_DEPLOY_KNOWN_HOSTS }}
          AARAJ_PUBLIC_BASE_URL: ${{ vars.AARAJ_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          health_base="$AARAJ_PUBLIC_BASE_URL"
          [[ "$health_base" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || {
            echo 'AARAJ_PUBLIC_BASE_URL must be an HTTPS origin without a path.' >&2
            exit 2
          }

          check_public_health() {
            local storefront_status readiness_status
            for _ in {1..30}; do
              storefront_status="$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' "$health_base/" || true)"
              readiness_status="$(curl --silent --max-time 10 --output "$health_body_file" --write-out '%{http_code}' "$health_base/api/health/ready" || true)"
              if [[ "$storefront_status" == 200 && "$readiness_status" == 200 ]] && \
                node --input-type=module -e '
                  let body = "";
                  for await (const chunk of process.stdin) body += chunk;
                  try {
                    const result = JSON.parse(body);
                    if (result.status !== "ok" || result.database !== "ok" || result.redis !== "ok") process.exit(1);
                  } catch {
                    process.exit(1);
                  }
                ' < "$health_body_file"; then
                return 0
              fi
              sleep 2
            done
            echo "Public health checks failed after 30 attempts (storefront HTTP ${storefront_status:-unknown}, readiness HTTP ${readiness_status:-unknown})." >&2
            return 1
          }

          health_body_file="$(mktemp)"
          trap 'rm -f -- "$health_body_file"' EXIT

          activated=false
          if bash infrastructure/production/deploy-release.sh activate "$RELEASE_COMMIT"; then
            activated=true
          fi
          if [[ "$activated" == true ]] && check_public_health && \
            node infrastructure/production/check-public-storefront.mjs "$health_base"; then
            echo "AARAJ release $RELEASE_COMMIT passed public HTTPS, API, PostgreSQL, and Redis health checks." >> "$GITHUB_STEP_SUMMARY"
            echo 'The storefront HTML, SEO metadata, canonical origin, manifest, and generated icons passed public checks.' >> "$GITHUB_STEP_SUMMARY"
            bash infrastructure/production/deploy-release.sh pathao-commit "$RELEASE_COMMIT"
            exit 0
          fi

          bash infrastructure/production/deploy-release.sh pathao-restore "$RELEASE_COMMIT"

          if [[ "$MIGRATION_REQUIRED" == true ]]; then
            bash infrastructure/production/deploy-release.sh restart "$RELEASE_COMMIT"
            echo 'Migration-bearing release did not pass activation or health checks. No automatic database or code rollback was attempted; follow the documented recovery procedure.' | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

          echo 'Release health failed; attempting compatible previous-release rollback.' | tee -a "$GITHUB_STEP_SUMMARY" >&2
          bash infrastructure/production/deploy-release.sh rollback "$RELEASE_COMMIT"
          check_public_health
          exit 1

      - name: Restore pending Pathao configuration after interruption
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          RELEASE_COMMIT: ${{ needs.deployment-gate.outputs.commit }}
          AARAJ_DEPLOY_HOST: ${{ vars.AARAJ_DEPLOY_HOST }}
          AARAJ_DEPLOY_PORT: ${{ vars.AARAJ_DEPLOY_PORT }}
          AARAJ_DEPLOY_USER: ${{ vars.AARAJ_DEPLOY_USER }}
          AARAJ_DEPLOY_SSH_KEY: ${{ secrets.AARAJ_DEPLOY_SSH_KEY }}
          AARAJ_DEPLOY_KNOWN_HOSTS: ${{ secrets.AARAJ_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          result="$(bash infrastructure/production/deploy-release.sh pathao-restore "$RELEASE_COMMIT")"
          printf '%s\n' "$result"
          if [[ "$result" == 'Pathao runtime configuration restored.' ]]; then
            bash infrastructure/production/deploy-release.sh restart "$RELEASE_COMMIT"
          fi
